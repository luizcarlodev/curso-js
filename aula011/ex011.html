<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nacionalidade</title>

        <style>
            div#res {
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Nacionalidade</h1>
        <input
            placeholder="Informe seu país"
            type="text"
            name="txtnasc"
            id="txtnasc"
        />
        <input
            type="button"
            value="Enviar"
            onclick="validadar_nascionalidade()"
        />
        <div id="res"></div>

        <script>
            function validadar_nascionalidade() {
                var txtnasc = window.document.getElementById("txtnasc");
                var res = window.document.getElementById("res");
                if (txtnasc.value !== "Brasil") {
                    res.innerText = "Você é estrangeiro!";
                } else {
                    res.innerText = "Você é brasileiro!";
                }
            }
        </script>
    </body>
</html>
